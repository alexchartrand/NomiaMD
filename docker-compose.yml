# One app stack: prod (a release tag) or demo (a branch, docker-compose.demo.yml on top), each
# its own compose project from its own checkout, so they deploy independently. Neither
# publishes a port: the shared `edge` Caddy (edge/docker-compose.yml) is the only public
# ingress and reaches each stack's `frontend` over the external nomiamd-edge network.

networks:
  # A fixed subnet so `frontend` can be given a static address (below) — backend pins
  # FORWARDED_ALLOW_IPS to that exact address rather than trusting any peer that can reach
  # it. Docker refuses overlapping subnets, so each stack on the host needs its own
  # NETWORK_PREFIX (see .env.example).
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_PREFIX:-172.28.0}.0/24
  edge:
    external: true
    name: nomiamd-edge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomiamd
      POSTGRES_USER: nomiamd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomiamd"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks: [internal]
    # Everything in this checkout's root .env (see .env.example), so a new backend setting
    # needs no edit here. `environment:` wins over env_file: it pins the values that must
    # differ inside a container from a developer's local .env.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nomiamd:${POSTGRES_PASSWORD}@postgres:5432/nomiamd
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/ramq-lancedb
      SAMPLE_PATIENTS_DIR: /consultations
      # uvicorn's --proxy-headers trusts X-Forwarded-For from nginx's static address only
      # (`frontend` below), not from any peer on the network, so rate limiting sees real
      # client IPs and can't be reset by a forged header.
      FORWARDED_ALLOW_IPS: ${NETWORK_PREFIX:-172.28.0}.10
      # Demo-only features (the Epic sandbox) refuse to start under production; only
      # docker-compose.demo.yml overrides it.
      APP_ENV: production
      # The edge `caddy` terminates TLS, so the session cookie is always HTTPS-only here,
      # whatever a local .env says (COOKIE_SECURE=false is for uvicorn over plain HTTP).
      COOKIE_SECURE: "true"
    volumes:
      # Produced by the separate ramq-ingestion repo, not by this compose file — must
      # already be populated at the host's DB_PATH before `backend` can start (LanceDB.open()
      # checks for a current code version during startup, before /health can respond). One
      # directory holds billing_codes' `codes_<rev>`/`code_versions` tables and
      # ramq_chatbot's `documents-embeddings` table. See the root .env.example.
      - ${DB_PATH:?set DB_PATH in .env}:/data/ramq-lancedb:ro
      # consultations/ is a repo-root directory, outside this service's build context
      # (./backend), so it can't be baked into the image via COPY — bind-mounted instead.
      # See SAMPLE_PATIENTS_DIR in app/sample_patients/service.py.
      - ./consultations:/consultations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Runs the extractions the backend queues in Redis. Same image and environment as
  # `backend`; no port, no healthcheck endpoint — scale with replicas / WORKER_MAX_JOBS.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    # The image's HEALTHCHECK probes the backend's /health, which nothing serves here.
    healthcheck:
      disable: true
    networks: [internal]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://nomiamd:${POSTGRES_PASSWORD}@postgres:5432/nomiamd
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/ramq-lancedb
      APP_ENV: production
    volumes:
      - ${DB_PATH:?set DB_PATH in .env}:/data/ramq-lancedb:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      ALLOWED_CIDRS: ${ALLOWED_CIDRS}
    networks:
      # Static IP so the backend's FORWARDED_ALLOW_IPS (above) can pin trust to nginx
      # specifically instead of the whole subnet.
      internal:
        ipv4_address: ${NETWORK_PREFIX:-172.28.0}.10
      # The name edge/Caddyfile proxies this stack's domain to — unique per stack.
      edge:
        aliases:
          - ${EDGE_ALIAS:-prod-frontend}
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
