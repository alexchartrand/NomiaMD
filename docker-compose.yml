networks:
  # A fixed subnet so `frontend` can be given a static address (below) — backend pins
  # --forwarded-allow-ips to that exact address rather than trusting any peer that can
  # reach it (see backend/Dockerfile).
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomiamd
      POSTGRES_USER: nomiamd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomiamd"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    networks: [internal]
    environment:
      DATABASE_URL: postgresql+psycopg://nomiamd:${POSTGRES_PASSWORD}@postgres:5432/nomiamd
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/ramq-lancedb
      RAMQ_CHATBOT_DB_PATH: /data/ramq-chatbot-lancedb
      SAMPLE_PATIENTS_DIR: /consultations
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # No TLS in this compose file yet (see root .env.example) — a `Secure` cookie would
      # be silently dropped by the browser over plain HTTP. Flip to true once a
      # TLS-terminating reverse proxy is in front of `frontend`.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Both produced by the separate ramq-ingestion repo, not by this compose file — must
      # already be populated at RAMQ_LANCEDB_PATH/RAMQ_CHATBOT_LANCEDB_PATH before `backend`
      # can even start (it reads DB_PATH/RAMQ_CHATBOT_DB_PATH at import time, before /health
      # can respond). Two separate databases: DB_PATH backs billing_codes'
      # `codes`/`code-embeddings` tables, RAMQ_CHATBOT_DB_PATH backs ramq_chatbot's own
      # `documents-embeddings` table. See docker-compose.yml.example note in the root
      # .env.example.
      - ${RAMQ_LANCEDB_PATH}:/data/ramq-lancedb:ro
      - ${RAMQ_CHATBOT_LANCEDB_PATH}:/data/ramq-chatbot-lancedb:ro
      # consultations/ is a repo-root directory, outside this service's build context
      # (./backend), so it can't be baked into the image via COPY — bind-mounted instead.
      # See SAMPLE_PATIENTS_DIR in app/sample_patients.py.
      - ./consultations:/consultations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      ALLOWED_CIDRS: ${ALLOWED_CIDRS}
    networks:
      # Static IP so backend/Dockerfile's --forwarded-allow-ips can pin trust to nginx
      # specifically instead of the whole subnet — keep these two values in sync.
      internal:
        ipv4_address: 172.28.0.10
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS termination for nomiamd.com / www.nomiamd.com — the only public ingress. Caddy
  # fetches and renews Let's Encrypt certs automatically from the Caddyfile's site
  # addresses; caddy_data is where it persists the ACME account + certs across restarts.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
