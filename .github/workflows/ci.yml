name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
        env:
          DB_PATH: ${{ runner.temp }}/ci-lancedb
          RAMQ_CHATBOT_DB_PATH: ${{ runner.temp }}/ci-lancedb-chatbot
          MISTRAL_API_KEY: fake-key-not-used-tests-are-fully-mocked
          MISTRAL_EMBEDDING_MODEL: mistral-embed
          JWT_SECRET_KEY: test-secret-not-for-production
          COOKIE_SECURE: "false"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nomiamd-backend:ci ./backend
      - run: docker build -t nomiamd-frontend:ci ./frontend
