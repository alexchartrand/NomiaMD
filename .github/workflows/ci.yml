name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock.txt && pip install -e .[dev]
      - name: Create throwaway LanceDB fixture (no real ramq-ingestion data needed)
        run: python scripts/make_ci_fixture_db.py
        env:
          DB_PATH: ${{ runner.temp }}/ci-lancedb
      - run: pytest -q
        env:
          DB_PATH: ${{ runner.temp }}/ci-lancedb
          MISTRAL_API_KEY: fake-key-not-used-tests-are-fully-mocked
          MISTRAL_EMBEDDING_MODEL: mistral-embed
          JWT_SECRET_KEY: test-secret-not-for-production

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nomiamd-backend:ci ./backend
      - run: docker build -t nomiamd-frontend:ci ./frontend
