server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy (the only public ingress, static address in edge/docker-compose.yml — keep the two
    # in sync) replaces any client-sent X-Forwarded-For with the peer it saw, so trusting that
    # header from Caddy alone gives $remote_addr the real client. Without this, every
    # visitor is Caddy's container address to the allowlist below and to the backend's
    # rate limits (uvicorn reads X-Forwarded-For from nginx, see backend/Dockerfile).
    set_real_ip_from 172.30.0.11;
    real_ip_header X-Forwarded-For;

    client_max_body_size 5m;

    # Inherited by both /api locations below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Public: the marketing site (/, /prix, /contact, /securite, /confidentialite) and the
    # static assets every page, app included, is built from.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is picked up immediately; the
    # hashed asset bundle Vite emits everything else as can be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Network-level access restriction — a defense-in-depth layer in front of the app's own
    # per-user login (backend/app/auth/). allowlist.conf (`allow` lines + `deny all`) is
    # generated at container start by docker-entrypoint.sh from ALLOWED_CIDRS. It guards the
    # app's pages and the whole API; the bundle itself is public (the site shares it), so
    # the API is what it actually protects. Matches /app, /app/..., /login and /login/.
    location ~ ^/(app|login)(/|$) {
        include /etc/nginx/allowlist.conf;
        try_files $uri /index.html;
    }

    # Matching trailing slashes on both sides is what strips the /api prefix here, mirroring
    # vite.config.ts's dev-server rewrite (path => path.replace(/^\/api/, "")) so
    # src/api.ts's fetch("/api/...") calls need no change between dev and prod.
    location /api/ {
        include /etc/nginx/allowlist.conf;
        proxy_pass http://backend:8000/;
    }

    # The public keys an EHR checks our signed client assertions against (backend/app/jwks/,
    # Epic's JWK Set URL). Public by design, and fetched from Epic's servers, which the
    # allowlist would refuse.
    location = /.well-known/jwks.json {
        proxy_pass http://backend:8000/.well-known/jwks.json;
    }

    # The site's contact form (app/contact/, no login) is the public write route; the
    # backend rate-limits it per client and drops honeypot hits.
    location = /api/contact {
        proxy_pass http://backend:8000/contact;
    }
}
