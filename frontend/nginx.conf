server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Network-level access restriction — a defense-in-depth layer in front of the app's own
    # per-user login (backend/app/auth/). Generated at container start by
    # docker-entrypoint.sh from ALLOWED_CIDRS. Applies to the whole app (static UI and /api
    # alike), not just the API.
    include /etc/nginx/conf.d/allowed_ips.conf;
    deny all;

    client_max_body_size 5m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is picked up immediately; the
    # hashed asset bundle Vite emits everything else as can be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Matching trailing slashes on both sides is what strips the /api prefix here, mirroring
    # vite.config.ts's dev-server rewrite (path => path.replace(/^\/api/, "")) so
    # src/api.ts's fetch("/api/...") calls need no change between dev and prod.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
