  - number: "09996"
    description: >-
      Forfait de garde sur place à l'urgence (P.G. 1.4), seul médecin — de 20 h à 24 h, tous les jours
    care_settings: [urgence]
    day_types: [semaine, fin_de_semaine, ferie]
