[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomiamd-backend"
version = "0.1.0"
description = "Extracts RAMQ billing codes (and future outputs) from clinical transcripts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "llama-index-core>=0.12",
    "llama-index-embeddings-mistralai>=0.3",
    "llama-index-llms-mistralai>=0.10",
    "pandas>=2.0",
    "lancedb>=0.37",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
